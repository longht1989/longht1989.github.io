<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f121d" />
    <title>FOOTBALL GACHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <h1>CASINO GACHA</h1>
          <span class="subtitle">★ Vegas Jackpot Edition ★</span>
        </div>
        <button id="sound-toggle" class="sound-toggle-btn" aria-label="Bật/Tắt âm thanh" title="Âm thanh">
          🔊
        </button>
      </header>

      <main class="machine-container">
        <!-- Bình thủy tinh chứa bóng gacha -->
        <div class="jar">
          <canvas id="gacha-canvas"></canvas>
          <div class="jar-shine"></div>
        </div>

        <!-- Ống & khay thoát bóng phía dưới -->
        <div class="machine-chute-base">
          <div class="chute-tunnel">
            <div class="chute-gate"></div>
            <div id="chute-ball"></div>
          </div>
        </div>
      </main>

      <div class="controls">
        <div class="btn-wrapper">
          <button id="spin-btn" aria-label="Quay thưởng casino">
            <span class="btn-icon">🎰</span>
            <span class="btn-text">QUAY THƯỞNG</span>
          </button>
        </div>
      </div>

      <!-- Modal hiển thị kết quả -->
      <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-text">
        <div class="modal-content">
          <div class="result-badge">★ JACKPOT WINNER ★</div>
          <div class="logo-container">
            <img id="result-logo" src="" alt="Club Logo" class="winning-logo hidden" />
          </div>
          <div id="result-text" class="winning-club"></div>
          <button id="close-modal" aria-label="Nhận thưởng và tiếp tục">NHẬN THƯỞNG</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
